<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpiando Tu Mente</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CAF50">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
</head>
<body>
    <div class="container">
        <header>
            <h1>Día <span id="day-number">1</span> de 30</h1>
            <p class="subtitle">Limpiando tu mente, un día a la vez.</p>
            <div class="badge">Has completado el reto <span id="completion-counter">0</span> veces</div>
        </header>

        <div id="learning-view">
            <main class="verse-card">
                <h2 id="verse-ref">Cargando...</h2>
                <p id="verse-text" class="verse-text">Conectando con la base de datos...</p>
            </main>

            <div class="controls">
                <button id="btn-prev" onclick="changeDay(-1)">Anterior</button>
                <button id="btn-next" onclick="handleNext()">Siguiente / Memorizado</button>
            </div>
            
            <div class="progress-bar" style="margin-bottom: 20px;">
                <div id="progress" class="progress"></div>
            </div>

            <button id="btn-blur" class="icon-btn" onclick="toggleBlur()" title="Ocultar/Mostrar texto (Modo Prueba)">
                <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>
        </div>

        <div id="congrats-view" style="display: none;">
            <main class="verse-card congrats-card">
                <h2>¡Felicidades! 🎉</h2>
                <p class="verse-text">Has completado los 30 días de renovación mental. La constancia es clave en esta lucha.</p>
                <button onclick="restartChallenge()" class="btn-restart">Volver a empezar (Día 1)</button>
            </main>
        </div>

        <footer class="attribution">
            Ícono creado por <a href="https://www.flaticon.es/autores/freepik" target="_blank" rel="noopener noreferrer">Freepik</a> de <a href="https://www.flaticon.es/" target="_blank" rel="noopener noreferrer">Flaticon</a>
        </footer>
    </div>

    <script>
        // Registrar el Service Worker para uso offline
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registrado con éxito');
                    })
                    .catch(err => {
                        console.log('Error al registrar el ServiceWorker', err);
                    });
            });
        }

        // Inicializar variables desde localStorage
        let currentDay = parseInt(localStorage.getItem('verseDay')) || 1;
        let completions = parseInt(localStorage.getItem('verseCompletions')) || 0;

        // Mostrar contador inicial
        document.getElementById('completion-counter').innerText = completions;

        function fetchVerse(day) {
            fetch('verses.json')
                .then(response => response.json())
                .then(data => {
                    let dayStr = day.toString();
                    
                    if (data[dayStr]) {
                        document.getElementById('day-number').innerText = day;
                        document.getElementById('verse-ref').innerText = data[dayStr].cita;
                        document.getElementById('verse-text').innerText = `"${data[dayStr].texto}"`;
                        
                        // Asegurarnos de que el texto no empiece borroso al cambiar de día
                        document.getElementById('verse-text').classList.remove('blurred-text');
                        resetEyeIcon(); 

                        updateProgress(day);
                        updateButtons(day);
                    } else {
                        console.warn("Día no encontrado, corrigiendo memoria...");
                        currentDay = 1;
                        localStorage.setItem('verseDay', currentDay);
                        fetchVerse(currentDay);
                    }
                })
                .catch(error => {
                    console.error('Error fetching verse:', error);
                    document.getElementById('verse-text').innerText = "Error cargando los versículos. Verifica que verses.json esté en la misma carpeta.";
                });
        }

        function updateButtons(day) {
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            
            btnPrev.disabled = (day === 1);

            if (day === 30) {
                btnNext.innerText = "¡Completar Reto!";
                btnNext.classList.add('btn-finish');
            } else {
                btnNext.innerText = "Siguiente / Memorizado";
                btnNext.classList.remove('btn-finish');
            }
        }

        function handleNext() {
            if (currentDay === 30) {
                showCongrats();
            } else {
                changeDay(1);
            }
        }

        function changeDay(step) {
            let newDay = currentDay + step;
            if (newDay >= 1 && newDay <= 30) {
                currentDay = newDay;
                localStorage.setItem('verseDay', currentDay);
                fetchVerse(currentDay);
            }
        }

        function showCongrats() {
            document.getElementById('learning-view').style.display = 'none';
            document.getElementById('congrats-view').style.display = 'block';
            
            completions++;
            localStorage.setItem('verseCompletions', completions);
            document.getElementById('completion-counter').innerText = completions;
        }

        function restartChallenge() {
            currentDay = 1;
            localStorage.setItem('verseDay', currentDay);
            
            document.getElementById('congrats-view').style.display = 'none';
            document.getElementById('learning-view').style.display = 'block';
            
            fetchVerse(currentDay);
        }

        function updateProgress(day) {
            const percentage = (day / 30) * 100;
            document.getElementById('progress').style.width = percentage + '%';
        }

        function toggleBlur() {
            const verseText = document.getElementById('verse-text');
            const eyeIcon = document.getElementById('eye-icon');
            
            verseText.classList.toggle('blurred-text');

            // Cambiar el ícono dependiendo de si está borroso o no
            if (verseText.classList.contains('blurred-text')) {
                // Ojo cerrado / tachado
                eyeIcon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
                document.getElementById('btn-blur').style.color = '#4CAF50'; // Darle color activo
            } else {
                resetEyeIcon();
            }
        }

        function resetEyeIcon() {
            const eyeIcon = document.getElementById('eye-icon');
            // Ojo abierto normal
            eyeIcon.innerHTML = `
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            `;
            document.getElementById('btn-blur').style.color = '#888'; // Color inactivo
        }

        // Iniciar la app cargando el día actual
        fetchVerse(currentDay);
    </script>
</body>
</html>
