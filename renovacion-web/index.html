<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpiando Tu Mente</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" id="theme-meta" content="#121212">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
</head>
<body data-mode="dark" data-palette="default">
    <div class="container">

        <div id="learning-view">
            <header>
                <div class="header-top">
                    <div class="spacer"></div> 
                    
                    <h1>Día <span id="day-number">1</span> de <span id="total-days-label">30</span></h1>
                    
                    <button class="settings-trigger" onclick="toggleSettings()" title="Ajustes">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </button>
                </div>

                <p class="subtitle" id="current-challenge-title">Cargando reto...</p>
                <div class="badge">Has completado el reto <span id="completion-counter">0</span> veces</div>
            </header>

            <main class="verse-card">
                <div class="verse-content">
                    <h2 id="verse-ref">Cargando...</h2>
                    <p id="verse-text" class="verse-text">Conectando con la base de datos...</p>
                </div>
            </main>

            <div class="controls">
                <button id="btn-prev" onclick="changeDay(-1)">&lt;</button>
                <button id="btn-next" onclick="handleNext()">&gt;</button>
            </div>
            
            <div class="progress-bar" style="margin-bottom: 20px;">
                <div id="progress" class="progress"></div>
            </div>

            <button id="btn-blur" class="icon-btn" onclick="toggleBlur()" title="Ocultar/Mostrar texto">
                <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>
        </div>

        <div id="settings-view" class="settings-view" style="display: none;">
            <h2>Configuración</h2>
            
            <div class="setting-item">
                <label>Área a combatir</label>
                <select id="category-select" class="category-dropdown" onchange="changeCategory(this.value)">
                    </select>
            </div>

            <div class="setting-item">
                <label>Tema (Claro / Oscuro)</label>
                <div class="mode-selector">
                    <button id="mode-dark" class="mode-btn" onclick="setMode('dark')">Oscuro</button>
                    <button id="mode-light" class="mode-btn" onclick="setMode('light')">Claro</button>
                </div>
            </div>

            <div class="setting-item">
                <label>Paleta de Colores</label>
                <div class="palette-grid">
                    <div id="pal-default" class="palette-circle bg-green" onclick="setPalette('default')" title="Verde"></div>
                    <div id="pal-women" class="palette-circle bg-pink" onclick="setPalette('women')" title="Rosa"></div>
                    <div id="pal-unisex" class="palette-circle bg-blue" onclick="setPalette('unisex')" title="Azul"></div>
                </div>
            </div>

            <button class="btn-back" onclick="toggleSettings()">Volver</button>
        </div>

        <div id="congrats-view" style="display: none;">
            <main class="verse-card congrats-card">
                <h2>¡Felicidades! 🎉</h2>
                <p id="congrats-text" class="verse-text">Has completado los días de renovación mental. La constancia es clave en esta lucha.</p>
                <button onclick="restartChallenge()" class="btn-restart">Volver a empezar (Día 1)</button>
            </main>
        </div>

        <footer class="attribution">
            Ícono creado por <a href="https://www.flaticon.es/autores/freepik" target="_blank" rel="noopener noreferrer">Freepik</a> de <a href="https://www.flaticon.es/" target="_blank" rel="noopener noreferrer">Flaticon</a>
        </footer>
    </div>

    <script>
        // Registrar Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('Error SW', err));
            });
        }

        // Variables de estado
        let currentCategory = localStorage.getItem('verseCategory') || 'sexualidad';
        let currentDay = parseInt(localStorage.getItem(`verseDay_${currentCategory}`)) || 1;
        let completions = parseInt(localStorage.getItem(`verseCompletions_${currentCategory}`)) || 0;
        let currentMode = localStorage.getItem('appMode') || 'dark';
        let currentPalette = localStorage.getItem('appPalette') || 'default';
        let totalDays = 30;

        // Inicialización
        function initApp() {
            setMode(currentMode);
            setPalette(currentPalette);
            document.getElementById('completion-counter').innerText = completions;
            fetchVerse(currentDay);
        }

        function fetchVerse(day) {
            fetch('verses.json')
                .then(response => response.json())
                .then(data => {
                    // Poblar el selector si está vacío
                    const select = document.getElementById('category-select');
                    if (select.options.length === 0) {
                        for (const key in data) {
                            const option = document.createElement('option');
                            option.value = key;
                            option.textContent = data[key].nombre;
                            if (key === currentCategory) option.selected = true;
                            select.appendChild(option);
                        }
                    }

                    const categoryData = data[currentCategory];
                    const verses = categoryData.versos;
                    totalDays = Object.keys(verses).length;
                    
                    document.getElementById('current-challenge-title').innerText = `Luchando contra: ${categoryData.nombre}`;
                    document.getElementById('total-days-label').innerText = totalDays;

                    let dayStr = day.toString();
                    if (verses[dayStr]) {
                        document.getElementById('day-number').innerText = day;
                        document.getElementById('verse-ref').innerText = verses[dayStr].cita;
                        document.getElementById('verse-text').innerText = `"${verses[dayStr].texto}"`;
                        document.getElementById('verse-text').classList.remove('blurred-text');
                        resetEyeIcon(); 
                        updateProgress(day);
                        updateButtons(day);
                    } else {
                        currentDay = 1;
                        fetchVerse(1);
                    }
                })
                .catch(err => console.error('Error cargando versos:', err));
        }

        function changeCategory(newCategory) {
            currentCategory = newCategory;
            localStorage.setItem('verseCategory', currentCategory);
            
            // Cargar progreso específico
            currentDay = parseInt(localStorage.getItem(`verseDay_${currentCategory}`)) || 1;
            completions = parseInt(localStorage.getItem(`verseCompletions_${currentCategory}`)) || 0;
            
            document.getElementById('completion-counter').innerText = completions;
            fetchVerse(currentDay);
            toggleSettings(); 
        }

        function setMode(mode) {
            currentMode = mode;
            document.body.setAttribute('data-mode', mode);
            localStorage.setItem('appMode', mode);
            
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`mode-${mode}`).classList.add('active');

            const metaColor = mode === 'light' ? '#f0f2f5' : '#121212';
            document.getElementById('theme-meta').setAttribute('content', metaColor);
        }

        function setPalette(palette) {
            currentPalette = palette;
            document.body.setAttribute('data-palette', palette);
            localStorage.setItem('appPalette', palette);
            
            document.querySelectorAll('.palette-circle').forEach(c => c.classList.remove('active'));
            const id = palette === 'default' ? 'pal-default' : palette === 'women' ? 'pal-women' : 'pal-unisex';
            document.getElementById(id).classList.add('active');
        }

        function toggleSettings() {
            const learning = document.getElementById('learning-view');
            const settings = document.getElementById('settings-view');
            const congrats = document.getElementById('congrats-view');

            if (settings.style.display === 'none') {
                learning.style.display = 'none';
                congrats.style.display = 'none';
                settings.style.display = 'block';
            } else {
                settings.style.display = 'none';
                learning.style.display = 'block';
            }
        }

        function updateButtons(day) {
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            btnPrev.disabled = (day === 1);
            
            if (day === totalDays) {
                btnNext.innerText = "¡Completar!";
                btnNext.classList.add('btn-finish');
            } else {
                btnNext.innerText = ">"; 
                btnNext.classList.remove('btn-finish');
            }
        }

        function handleNext() {
            if (currentDay === totalDays) showCongrats();
            else changeDay(1);
        }

        function changeDay(step) {
            let newDay = currentDay + step;
            if (newDay >= 1 && newDay <= totalDays) {
                currentDay = newDay;
                localStorage.setItem(`verseDay_${currentCategory}`, currentDay);
                fetchVerse(currentDay);
            }
        }

        function showCongrats() {
            document.getElementById('learning-view').style.display = 'none';
            document.getElementById('congrats-view').style.display = 'block';
            completions++;
            localStorage.setItem(`verseCompletions_${currentCategory}`, completions);
            document.getElementById('completion-counter').innerText = completions;
        }

        function restartChallenge() {
            currentDay = 1;
            localStorage.setItem(`verseDay_${currentCategory}`, 1);
            document.getElementById('congrats-view').style.display = 'none';
            document.getElementById('learning-view').style.display = 'block';
            fetchVerse(1);
        }

        function updateProgress(day) {
            document.getElementById('progress').style.width = (day / totalDays * 100) + '%';
        }

        function toggleBlur() {
            const vt = document.getElementById('verse-text');
            const icon = document.getElementById('eye-icon');
            vt.classList.toggle('blurred-text');
            if (vt.classList.contains('blurred-text')) {
                icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
            } else {
                resetEyeIcon();
            }
        }

        function resetEyeIcon() {
            document.getElementById('eye-icon').innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
        }

        initApp();
    </script>
</body>
</html>
